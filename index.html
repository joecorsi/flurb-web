<!doctype html>
<html lang="en" class="player-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="A simple music player for tracks in your Dropbox.">
  <meta name="apple-mobile-web-app-title" content="flurb">
  <title>flurb</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=1">
  <link rel="stylesheet" href="./styles.css?v=new-playlist-1">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" integrity="sha384-uTYyvsSSUZeaPhb5RbKlQa0zY/WpX/QHfvg2mczXyBQOpkWPEDy9lczyp+w7SKXu" crossorigin="anonymous" defer></script>
  <script src="./turso-sync.js?v=2" defer></script>
  <script src="./artwork-cache.js?v=1" defer></script>
  <script src="./app.js?v=new-playlist-1" defer></script>
</head>
<body>
  <div class="app-shell">
    <main id="top">
      <section class="library" aria-labelledby="library-heading">
        <div class="library-sticky" id="library-sticky">
          <div class="search-row">
            <button class="home-button" id="home-button" type="button" aria-label="Go to music library root" title="Music library root" disabled><i data-lucide="house" aria-hidden="true"></i></button>
            <div class="search-box"><i class="search-icon" data-lucide="search" aria-hidden="true"></i><input id="search" type="search" placeholder="Search" aria-label="Search tracks and artists" disabled><button class="clear-search" id="clear-search" type="button" aria-label="Clear search" title="Clear search" disabled><i data-lucide="x" aria-hidden="true"></i></button></div>
          </div>
          <div class="action-row">
            <button class="home-button settings-button" id="settings-button" type="button" aria-label="Settings" title="Settings"><i data-lucide="settings" aria-hidden="true"></i><span class="settings-sync-spinner" aria-hidden="true"></span></button>
            <div class="mode-picker">
            <button class="mode-select" id="view-button" type="button" aria-haspopup="menu" aria-controls="view-menu" aria-expanded="false"><span id="view-label">Recently added</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
            <div class="mode-menu" id="view-menu" role="menu" hidden>
              <button type="button" role="menuitemradio" aria-checked="true" data-view="recent"><i class="view-option-icon" data-lucide="clock-3" aria-hidden="true"></i><span class="view-option-label">Recently added</span><span class="mode-count" id="recent-count">0</span></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-view="favorites"><i class="view-option-icon" data-lucide="heart" aria-hidden="true"></i><span class="view-option-label">Favorites</span><span class="mode-count" id="favorites-count">0</span></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-view="playlists"><i class="view-option-icon" data-lucide="list-music" aria-hidden="true"></i><span class="view-option-label">Playlists</span><span class="mode-count" id="playlists-count">0</span></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-view="library"><i class="view-option-icon" data-lucide="library" aria-hidden="true"></i><span class="view-option-label">Library</span><span class="mode-count" id="library-count">0</span></button>
            </div>
            </div>
          </div>
          <div class="breadcrumb-row">
            <nav class="breadcrumbs" id="breadcrumbs" aria-label="Music library location"></nav>
            <button class="shuffle-library" id="shuffle-library" type="button" aria-pressed="false" hidden>shuffle lib</button>
          </div>
        </div>
        <h2 class="sr-only" id="library-heading">Music library</h2>
        <span class="track-count sr-only" id="track-count"></span>
        <div class="notice" id="notice" role="status" aria-live="polite"><i class="notice-mark" data-lucide="sparkles" aria-hidden="true"></i><span id="notice-message"></span></div>
        <div class="track-list" id="track-list" aria-label="Music library">
          <div class="track-rows" id="table-body" role="list"></div>
          <div class="empty-state" id="empty-state"><div class="empty-glyph" aria-hidden="true"><i id="empty-icon" data-lucide="disc-3"></i></div><p>No tracks</p><span></span><a class="empty-settings" id="settings-link" href="./settings.html">Open Settings</a></div>
        </div>
      </section>
    </main>

    <footer class="player" id="player" aria-label="Audio player">
      <div class="player-track">
        <button class="player-artwork-button" id="player-artwork-button" type="button" aria-label="View current track artwork" disabled>
          <span class="track-artwork-shell player-artwork-shell" id="player-artwork-shell"><img class="track-artwork" id="player-artwork" alt=""><i class="artwork-placeholder" data-lucide="music-2" aria-hidden="true"></i></span>
          <i class="player-artwork-close-icon" data-lucide="x" aria-hidden="true"></i>
        </button>
        <button class="now-playing now-playing-link" id="now-playing-link" type="button" aria-label="Open the current track folder" disabled><span class="now-title-viewport" id="now-title-viewport"><strong id="now-title">Nothing playing yet</strong></span><span id="now-album"></span></button>
        <button class="icon-button favorite-button" id="now-favorite" type="button" aria-label="Favorite current track" title="Favorite current track" disabled><i data-lucide="heart" aria-hidden="true"></i></button>
      </div>
      <div class="player-controls">
        <div class="transport">
          <button class="icon-button transport-secondary" id="shuffle-button" type="button" aria-label="Shuffle off" aria-pressed="false" title="Shuffle"><i data-lucide="shuffle" aria-hidden="true"></i></button>
          <button class="icon-button" id="previous-button" type="button" aria-label="Previous track" disabled><i data-lucide="skip-back" aria-hidden="true"></i></button>
          <button class="play-button" id="play-button" type="button" aria-label="Play" disabled><i class="play-icon" data-lucide="play" aria-hidden="true"></i><i class="pause-icon" data-lucide="pause" aria-hidden="true"></i></button>
          <button class="icon-button" id="next-button" type="button" aria-label="Next track" disabled><i data-lucide="skip-forward" aria-hidden="true"></i></button>
          <button class="icon-button transport-secondary" id="repeat-button" type="button" aria-label="Repeat off" title="Repeat off"><i data-lucide="repeat" aria-hidden="true"></i></button>
        </div>
        <div class="scrubber-row"><span class="time-label" id="elapsed-time">0:00</span><input id="progress" class="range-input" type="range" min="0" max="100" value="0" aria-label="Track position" disabled><span class="time-label" id="duration-time">0:00</span></div>
      </div>
    </footer>
    <section class="artwork-viewer" id="artwork-viewer" aria-label="Track artwork" hidden>
      <div class="artwork-viewer-art">
        <div class="artwork-viewer-cover" id="artwork-viewer-cover"><img id="artwork-viewer-image" alt=""><i class="artwork-placeholder" data-lucide="music-2" aria-hidden="true"></i></div>
      </div>
    </section>
    <div class="settings-overlay" id="settings-overlay" hidden>
      <button class="settings-scrim" type="button" aria-label="Close settings" data-close-settings></button>
      <section class="settings-dialog" role="dialog" aria-modal="true" aria-label="Flurb settings">
        <header class="settings-dialog-header"><strong>Settings</strong><button class="icon-button settings-close" id="settings-close" type="button" aria-label="Close settings"><i data-lucide="x" aria-hidden="true"></i></button></header>
        <iframe class="settings-frame" id="settings-frame" src="./settings.html?embedded=1&v=no-focus-rings-1" title="Flurb settings"></iframe>
      </section>
    </div>
    <dialog class="playlist-picker" id="playlist-picker" aria-labelledby="playlist-picker-title">
      <div class="playlist-picker-body">
        <header class="playlist-picker-header">
          <h2 id="playlist-picker-title" tabindex="-1" autofocus>Add to playlist</h2>
          <button class="icon-button" id="playlist-picker-close" type="button" aria-label="Close playlist picker"><i data-lucide="x" aria-hidden="true"></i></button>
        </header>
        <div class="playlist-picker-list" id="playlist-picker-list"></div>
        <p class="playlist-picker-message" id="playlist-picker-message" role="status"></p>
        <button class="playlist-picker-create" id="playlist-picker-create" type="button">+ New playlist…</button>
      </div>
    </dialog>
    <dialog class="playlist-picker new-playlist" id="new-playlist" aria-labelledby="new-playlist-title">
      <form id="new-playlist-form">
        <header class="playlist-picker-header">
          <h2 id="new-playlist-title">New playlist</h2>
        </header>
        <div class="new-playlist-fields">
          <label for="new-playlist-name">Playlist name</label>
          <input id="new-playlist-name" type="text" autocomplete="off" required autofocus>
          <p class="playlist-picker-message is-error" id="new-playlist-message" role="status"></p>
          <div class="new-playlist-actions">
            <button type="button" id="new-playlist-cancel">Cancel</button>
            <button type="submit" id="new-playlist-submit">Create</button>
          </div>
        </div>
      </form>
    </dialog>
    <audio id="audio" preload="metadata"></audio>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>

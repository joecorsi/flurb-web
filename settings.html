<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111213">
  <title>flurb</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=1">
  <link rel="stylesheet" href="./styles.css?v=no-focus-rings-1">
  <script src="./turso-sync.js?v=2" defer></script>
  <script src="./settings.js?v=settings-2" defer></script>
</head>
<body class="settings-page">
  <main class="settings-shell">
    <a class="settings-back" href="./">← Player</a>
    <section class="settings-panel" aria-labelledby="dropbox-heading">
      <header class="settings-panel-header">
        <h1 id="dropbox-heading">Dropbox</h1>
        <button class="settings-connect" id="settings-connect" type="button">Connect Dropbox</button>
      </header>
      <dl class="settings-account" id="dropbox-account" hidden>
        <div><dt>Account</dt><dd id="dropbox-account-email">—</dd></div>
        <div><dt>Name</dt><dd id="dropbox-account-name">—</dd></div>
        <div><dt>Logged in</dt><dd id="dropbox-login-date">—</dd></div>
      </dl>
      <button class="settings-reconnect" id="settings-reconnect" type="button" hidden>Reconnect Dropbox for account details</button>
      <div class="settings-library" id="settings-library" hidden>
        <button class="settings-library-toggle" id="settings-library-toggle" type="button" aria-expanded="false" aria-controls="settings-folders">
          <span class="settings-library-current"><span>Music folder</span><strong id="settings-current-folder">No folder selected</strong></span>
          <svg class="settings-library-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <div id="settings-folders" class="settings-folders" hidden></div>
      </div>
      <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
    </section>
    <section class="settings-panel" aria-labelledby="turso-heading">
      <header class="settings-panel-header">
        <h1 id="turso-heading">Turso</h1>
        <button class="settings-connect" id="turso-connect" type="submit" form="turso-form">Connect Turso</button>
      </header>
      <form class="settings-account" id="turso-form">
        <label class="settings-field">Database URL<input id="turso-url" type="url" placeholder="libsql://…" required></label>
        <label class="settings-field">Database token<input id="turso-token" type="password" placeholder="Database-scoped token" autocomplete="off" required></label>
      </form>
      <button class="settings-reconnect" id="turso-disconnect" type="button" hidden>Disconnect Turso</button>
      <p id="turso-status" class="settings-status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
